name: Clearpage long-page writing regression
on:
  pull_request:
    paths:
      - index.html
      - tests/editor-scroll.mjs
      - .github/workflows/editor-scroll.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test-only pinned browsers
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Exercise editor in Chromium and Firefox, desktop and mobile widths
        run: node tests/editor-scroll.mjs
