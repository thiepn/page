name: Clearpage optional sync CI
on:
  pull_request:
  push:
    branches:
      - feat/optional-thiepn-account-sync
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Assert verified public client, explicit opt-in and no deployment activation
        run: |
          set -euo pipefail
          grep -Fq "ACCOUNT_CLIENT_ID='088b34ff-84ad-4746-a030-cc517159a17a'" src/config.js
          grep -Fq "ACCOUNT_REDIRECT='https://page.thiepn.dev/auth/callback/'" src/config.js
          grep -q "ACCOUNT_PUBLISHABLE_KEY='sb_publishable_" src/config.js
          grep -Fq 'if(!callback&&!getFlag(desiredKey))' src/account-sync.js
          grep -Fq 'if(!enabledConfig||!sso)return;' src/account-sync.js
          grep -q "false,now())" supabase/20261109_clearpage_optional_sync_PENDING.sql
          ! grep -RE 'service_role.*(eyJ|sb_secret_)' src
          test -f dist/index.html
          test -f dist/js/account-sync.js
          test -f dist/js/vendor/account-session/index.js
          test -f dist/js/vendor/account-session/browser-sso.js

  postgres-rls-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use disposable database only
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "postgres"
          command -v psql
          psql -v ON_ERROR_STOP=1 -c 'select current_database(), version()'
      - name: Apply synthetic Account fixtures, pending migration and RLS/CAS tests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/sql/fixtures.sql
          psql -v ON_ERROR_STOP=1 -f supabase/20261109_clearpage_optional_sync_PENDING.sql
          # Real onboarding staged an inactive binding before any activation.
          psql -v ON_ERROR_STOP=1 -f tests/sql/staged-inactive-binding.sql
          # CI only: replace the UUID placeholder with a synthetic client fixture.
          sed 's/REPLACE_WITH_MANUALLY_ISSUED_CLIENT_UUID/cccccccc-cccc-4ccc-8ccc-cccccccccccc/g' \
            supabase/20261109_clearpage_first_party_BIND_ONLY_AFTER_MANUAL_CLIENT_TEMPLATE.sql \
            > /tmp/clearpage-operator-binding.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/clearpage-operator-binding.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/rls-cas.sql
          # CRITICAL: use ONLY synthetic OAuth UUID in disposable localhost PG.
          sed 's/088b34ff-84ad-4746-a030-cc517159a17a/cccccccc-cccc-4ccc-8ccc-cccccccccccc/g' \
            supabase/clearpage_emergency_stop_REVIEW_ONLY.sql \
            > /tmp/clearpage-emergency-stop-synthetic.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/clearpage-emergency-stop-synthetic.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/emergency-rollback-verification.sql
          # Repeated stop must be safe, even with preexisting cloud data.
          psql -v ON_ERROR_STOP=1 -f /tmp/clearpage-emergency-stop-synthetic.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/emergency-rollback-verification.sql
          # Adversarial RED: a drifted table ACL must NOT prevent emergency
          # deactivation. This only mutates ephemeral localhost postgres:17.
          psql -v ON_ERROR_STOP=1 -c "update public.account_first_party_oauth_clients set active=true,automatic_identity_consent=true where app_slug='page'; update public.account_apps set active=true where slug='page'; grant truncate on public.clearpage_sync_state to authenticated;"
          psql -v ON_ERROR_STOP=1 -f /tmp/clearpage-emergency-stop-synthetic.sql

  browser-local-first:
    # Playwright 1.56.1 does not support ubuntu-26.04; pin the supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned test-only browser harness
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test local-first guest and account workspaces in real Chromium
        run: node tests/browser-smoke.mjs
      - name: Verify exact HTTPS Clearpage origin served from local build with all remote network blocked
        run: node tests/browser-origin-isolation.mjs
      - name: Test offline and concurrent multi-device HTTP sync against a simulated server
        run: node tests/browser-cloud-sim.mjs

  public-oauth-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify existing public Account OAuth discovery without credentials
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 20 \
            https://hycegznamzjhwinegaai.supabase.co/.well-known/oauth-authorization-server/auth/v1 \
            -o /tmp/clearpage-oauth-discovery.json
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --max-time 20 \
            https://account.thiepn.dev/release.json \
            -o /tmp/clearpage-account-release.json
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          spec=json.load(open('/tmp/clearpage-oauth-discovery.json'))
          release=json.load(open('/tmp/clearpage-account-release.json'))
          assert urlparse(spec['authorization_endpoint']).hostname=='hycegznamzjhwinegaai.supabase.co'
          assert urlparse(spec['token_endpoint']).hostname=='hycegznamzjhwinegaai.supabase.co'
          assert 'authorization_code' in spec['grant_types_supported']
          assert 'S256' in spec['code_challenge_methods_supported']
          assert isinstance(release,dict) and release
          print('CLEARPAGE_OAUTH_PUBLIC_DISCOVERY=PASS')
          PY
